<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b19">
  <title>Lineu Grimm · Fundo imperial discreto</title>
  <style>
    :root {
      color-scheme: dark;
      --noite: #100b19;
      --violeta: #28172f;
      --ouro: #d5a968;
      --ouro-suave: #9d7849;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    html { background: var(--noite); }
    body { overflow-x: hidden; font-family: Georgia, serif; }

    /* Fundo-base: o centro fica limpo para os futuros títulos e cartões. */
    .palacio {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 49% 46% at 50% 40%, rgba(84, 45, 106, .15), transparent 100%),
        radial-gradient(ellipse 31% 70% at -2% 52%, rgba(101, 44, 111, .19), transparent 100%),
        radial-gradient(ellipse 31% 70% at 102% 52%, rgba(101, 44, 111, .17), transparent 100%),
        linear-gradient(135deg, #1b1024 0%, #110b1b 43%, #140c20 75%, #0d0915 100%);
    }

    /* Uma textura ornamental quase invisível — sem competir com o conteúdo. */
    .palacio::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        repeating-linear-gradient(45deg, transparent 0 92px, rgba(217, 160, 103, .012) 93px 94px, transparent 95px 188px),
        repeating-linear-gradient(-45deg, transparent 0 92px, rgba(217, 160, 103, .012) 93px 94px, transparent 95px 188px);
      mask-image: linear-gradient(to right, black 0%, transparent 42%, transparent 58%, black 100%);
      -webkit-mask-image: linear-gradient(to right, black 0%, transparent 42%, transparent 58%, black 100%);
    }

    /* Luz ambiente discreta, sem desenho de arquitetura. */
    .aura {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      width: min(70vw, 920px);
      aspect-ratio: 1;
      left: 50%; top: 26%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(85, 42, 101, .1), transparent 65%);
      filter: blur(20px);
      animation: respirar 13s ease-in-out infinite alternate;
    }
    @keyframes respirar {
      from { opacity: .55; transform: translate(-50%, -50%) scale(.94); }
      to { opacity: .95; transform: translate(-50%, -50%) scale(1.07); }
    }

    /* Moldura simples, fina e reservada às bordas. */
    .moldura {
      position: absolute;
      inset: 22px;
      pointer-events: none;
      z-index: 1;
      border: 1px solid rgba(188, 141, 79, .24);
      box-shadow: inset 0 0 0 1px rgba(23, 14, 28, .28);
    }
    .moldura::before, .moldura::after {
      content:"";
      position: absolute;
      left: 50%; transform: translateX(-50%);
      height: 1px; width: min(180px, 28vw);
      background: linear-gradient(90deg, transparent, rgba(221, 175, 104, .55), transparent);
    }
    .moldura::before { top: -1px; }
    .moldura::after { bottom: -1px; opacity: .55; }

    .canto {
      position: absolute; width: 55px; height: 55px;
      pointer-events: none; z-index: 1;
      color: var(--ouro); opacity: .72;
    }
    .canto svg { width: 100%; height: 100%; display: block; }
    .canto.se { top: 16px; left: 16px; }
    .canto.sd { top: 16px; right: 16px; transform: scaleX(-1); }
    .canto.ie { bottom: 16px; left: 16px; transform: scaleY(-1); }
    .canto.id { bottom: 16px; right: 16px; transform: scale(-1); }

    /* Pontos de luz mínimos, localizados nas margens. */
    .poeira { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .poeira i {
      display: block; position: absolute; left: var(--x); top: var(--y);
      width: var(--r); height: var(--r); background: #efc67d; border-radius: 50%;
      box-shadow: 0 0 8px rgba(236, 184, 105, .52);
      opacity: var(--o);
      animation: cintilar var(--duration) ease-in-out var(--offset) infinite alternate;
    }
    @keyframes cintilar { to { opacity: .05; transform: translateY(-5px); } }

    /* Camada onde serão adicionados os botões, cartões e textos clicáveis. */
    #conteudo { position: relative; z-index: 2; min-height: 100vh; min-height: 100svh; }

    @media (max-width: 650px) {
      .palacio { background:
        radial-gradient(ellipse 85% 45% at 50% 30%, rgba(78, 37, 96, .17), transparent 100%),
        linear-gradient(145deg,#1b1024,#100b19 65%,#130c20); }
      .moldura { inset: 13px; }
      .canto { width: 38px; height: 38px; }
      .canto.se { top: 8px; left: 8px; }
      .canto.sd { top: 8px; right: 8px; }
      .canto.ie { bottom: 8px; left: 8px; }
      .canto.id { bottom: 8px; right: 8px; }
      .palacio::before { opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aura, .poeira i { animation: none; }
    }
  </style>
</head>
<body>
  <div class="palacio">
    <div class="aura" aria-hidden="true"></div>
    <div class="moldura" aria-hidden="true"></div>

    <!-- Pequenos cantos Art Déco, propositalmente afastados do centro. -->
    <div class="canto se" aria-hidden="true"><svg viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 54V15L15 1H54" stroke="currentColor" stroke-width="1.5"/><path d="M9 54V21L21 9H54" stroke="currentColor" stroke-opacity=".5" stroke-width=".8"/><path d="M15 28L28 15L35 22L22 35Z" stroke="currentColor" stroke-opacity=".55" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg></div>
    <div class="canto sd" aria-hidden="true"><svg viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 54V15L15 1H54" stroke="currentColor" stroke-width="1.5"/><path d="M9 54V21L21 9H54" stroke="currentColor" stroke-opacity=".5" stroke-width=".8"/><path d="M15 28L28 15L35 22L22 35Z" stroke="currentColor" stroke-opacity=".55" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg></div>
    <div class="canto ie" aria-hidden="true"><svg viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 54V15L15 1H54" stroke="currentColor" stroke-width="1.5"/><path d="M9 54V21L21 9H54" stroke="currentColor" stroke-opacity=".5" stroke-width=".8"/><path d="M15 28L28 15L35 22L22 35Z" stroke="currentColor" stroke-opacity=".55" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg></div>
    <div class="canto id" aria-hidden="true"><svg viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 54V15L15 1H54" stroke="currentColor" stroke-width="1.5"/><path d="M9 54V21L21 9H54" stroke="currentColor" stroke-opacity=".5" stroke-width=".8"/><path d="M15 28L28 15L35 22L22 35Z" stroke="currentColor" stroke-opacity=".55" stroke-width="1"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg></div>

    <div class="poeira" aria-hidden="true">
      <i style="--x:7%;--y:18%;--r:2px;--o:.32;--duration:5.4s;--offset:-2s"></i>
      <i style="--x:92%;--y:26%;--r:2px;--o:.24;--duration:6.8s;--offset:-1s"></i>
      <i style="--x:11%;--y:76%;--r:1.5px;--o:.23;--duration:7s;--offset:-4s"></i>
      <i style="--x:87%;--y:81%;--r:1.7px;--o:.32;--duration:6.3s;--offset:-3s"></i>
      <i style="--x:95%;--y:60%;--r:1.5px;--o:.22;--duration:5.8s;--offset:-1.8s"></i>
      <i style="--x:4%;--y:53%;--r:1.5px;--o:.2;--duration:6.2s;--offset:-3.4s"></i>
      <i style="--x:16%;--y:10%;--r:1px;--o:.2;--duration:7s;--offset:-2.3s"></i>
      <i style="--x:83%;--y:13%;--r:1px;--o:.2;--duration:7s;--offset:-5s"></i>
    </div>

    <main id="conteudo" aria-label="Conteúdo principal do site de Lineu Grimm"></main>
  </div>
</body>
</html>
